name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp lib/main.dart /tmp/keep/main.dart
          flutter create --org com.anivore --project-name anivore --platforms=android .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          mkdir -p lib
          cp /tmp/keep/main.dart lib/main.dart
          rm -rf test
          rm -f analysis_options.yaml

      - name: Apply package name and label
        run: |
          grep -rl "com.anivore.anivore" android | xargs -r sed -i 's/com\.anivore\.anivore/com.anivore.com/g'
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          mkdir -p android/app/src/main/kotlin/com/anivore/com
          cat > android/app/src/main/kotlin/com/anivore/com/MainActivity.kt <<'EOF'
          package com.anivore.com

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          sed -i 's/android:label="[^"]*"/android:label="Anivore"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anivore-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
