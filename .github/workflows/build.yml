name: Build Anivore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android प्रोजेक्ट बनता है, ऐप का नाम Anivore और पैकेज com.anivore.com सेट होता है।
      # MainActivity.kt में सिर्फ़ फ़ोन में स्कोर और सेटिंग सहेजने का छोटा कोड है (कोई बाहरी पैकेज नहीं)।
      - name: Create Android project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --org com.anivore --project-name com --platforms android
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Anivore"/' android/app/src/main/AndroidManifest.xml
          find android/app/src/main -name 'MainActivity.*' -delete
          mkdir -p android/app/src/main/kotlin/com/anivore/com
          cat > android/app/src/main/kotlin/com/anivore/com/MainActivity.kt << 'KTEOF'
          package com.anivore.com

          import android.content.Context
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val prefs = getSharedPreferences("anivore_store", Context.MODE_PRIVATE)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "anivore/store")
                      .setMethodCallHandler { call, result ->
                          val key = call.argument<String>("key") ?: ""
                          when (call.method) {
                              "get" -> result.success(prefs.getString(key, null))
                              "set" -> {
                                  val value = call.argument<String>("value") ?: ""
                                  prefs.edit().putString(key, value).apply()
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KTEOF

      - name: Packages
        run: flutter pub get

      # --obfuscate: Dart कोड के नाम बदल देता है, जिससे डिकंपाइल करना बहुत कठिन हो जाता है।
      # रिलीज़ बिल्ड में R8 (Java/Kotlin कोड का shrink और obfuscate) Flutter डिफ़ॉल्ट रूप से चलाता है।
      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anivore-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: Anivore-Symbols
          path: build/symbols
