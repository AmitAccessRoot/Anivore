name: Build Anivore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Creates the Android project (package com.anivore.com, app name Anivore).
      # Your own main.dart and pubspec.yaml are restored after creation.
      - name: Create Android project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          rm lib/main.dart pubspec.yaml
          flutter create . --org com.anivore --project-name com --platforms android
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Anivore"/' android/app/src/main/AndroidManifest.xml

      - name: Packages
        run: flutter pub get

      # --obfuscate renames Dart classes, methods and variables so the compiled
      # code is very hard to read. --split-debug-info stores the symbol files
      # outside the APK. R8 (Java/Kotlin shrinking and obfuscation) already runs
      # automatically in Flutter release builds.
      # Note: these protect the code only. assets/database.db stays a normal
      # file inside the APK and can be extracted by anyone.
      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anivore-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: Anivore-Symbols
          path: build/symbols
